name: Verify Android phone login
on:
  push:
    paths: ['apps/android/**', '.github/workflows/verify-android.yml']
  pull_request:
    paths: ['apps/android/**', '.github/workflows/verify-android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify pinned Gradle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
      - name: Compile, unit test and lint Android candidate
        working-directory: apps/android
        run: '"$RUNNER_TEMP/gradle-8.13/bin/gradle" --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug'
