name: Build development container candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-development-candidate
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: Test, publish and smoke-test immutable digest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development

    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/engagement-api

    steps:
      - name: Validate required environment variables
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID environment variable}"
          : "${GCP_REGION:?Missing GCP_REGION environment variable}"
          : "${GCP_ARTIFACT_REPOSITORY:?Missing GCP_ARTIFACT_REPOSITORY environment variable}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Missing GCP_WORKLOAD_IDENTITY_PROVIDER environment variable}"
          : "${GCP_SERVICE_ACCOUNT:?Missing GCP_SERVICE_ACCOUNT environment variable}"

      - name: Check out the selected reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/engagement-api/requirements.lock
            services/engagement-api/requirements-dev.lock

      - name: Run backend release gate
        working-directory: services/engagement-api
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.lock
          python -m ruff check app tests tools
          python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90
          node --test tests/config_parity.test.mjs
          python -m bandit --quiet --recursive app
          python -m pip_audit --requirement requirements.lock --disable-pip --no-deps

      - name: Authenticate to Google Cloud without a stored key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true

      - name: Sign in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/engagement-api
          file: services/engagement-api/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=engagement-api
          cache-to: type=gha,mode=max,scope=engagement-api

      - name: Smoke-test the published digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          container="ee-candidate-smoke"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name "$container" --publish 18080:8080 \
            -e EE_ENVIRONMENT=development \
            -e 'EE_APP_NAME=Elder Engage API' \
            -e EE_API_PREFIX=/v1 \
            -e EE_LOG_LEVEL=INFO \
            -e EE_GCP_PROJECT_ID="$GCP_PROJECT_ID" \
            -e EE_GCP_REGION="${{ vars.GCP_REGION }}" \
            -e EE_PUBLIC_API_ORIGIN=http://localhost:8080 \
            -e EE_TRUSTED_HOSTS=localhost \
            -e EE_CORS_ORIGINS=http://localhost:3000 \
            -e EE_CLOUD_SQL_INSTANCE="$GCP_PROJECT_ID:${{ vars.GCP_REGION }}:candidate" \
            -e EE_DATABASE_URL_SECRET_REF="projects/$GCP_PROJECT_ID/secrets/candidate-database-url/versions/latest" \
            -e EE_RATE_LIMIT_STORE=memory \
            -e EE_REDIS_URL_SECRET_REF= \
            -e EE_SESSION_SIGNING_KEY_SECRET_REF="projects/$GCP_PROJECT_ID/secrets/candidate-session-key/versions/latest" \
            -e EE_REFRESH_TOKEN_PEPPER_SECRET_REF="projects/$GCP_PROJECT_ID/secrets/candidate-refresh-pepper/versions/latest" \
            -e EE_FIELD_ENCRYPTION_KEY_SECRET_REF="projects/$GCP_PROJECT_ID/secrets/candidate-field-key/versions/latest" \
            -e EE_MEMBER_IDENTITY_PROVIDER=mock \
            -e EE_FIREBASE_PROJECT_ID= \
            -e EE_MEMBER_TOKEN_AUDIENCE= \
            -e EE_UPLOADS_BUCKET=candidate-uploads \
            -e EE_APPROVED_MEDIA_BUCKET=candidate-approved \
            -e EE_UPLOAD_SIGNER_SERVICE_ACCOUNT="candidate-upload@$GCP_PROJECT_ID.iam.gserviceaccount.com" \
            -e EE_UPLOAD_MAX_BYTES=10485760 \
            -e EE_UPLOAD_ALLOWED_MIME_TYPES=video/mp4,audio/mpeg,application/pdf \
            -e EE_UPLOAD_AUTHORIZATION_SECONDS=300 \
            -e EE_FCM_ENABLED=false \
            -e EE_FCM_PROJECT_ID= \
            -e EE_YOUTUBE_ENABLED=false \
            -e EE_YOUTUBE_API_KEY_SECRET_REF= \
            -e EE_MEET_MODE=disabled \
            -e EE_MEET_OAUTH_CLIENT_SECRET_REF= \
            -e EE_BROADCAST_PROVIDER=disabled \
            -e EE_AGORA_APP_ID= \
            -e EE_AGORA_APP_CERTIFICATE_SECRET_REF= \
            -e EE_ACCESS_TOKEN_MINUTES=10 \
            -e EE_REFRESH_TOKEN_DAYS=30 \
            "$IMAGE@$DIGEST"
          for attempt in {1..20}; do
            if response=$(curl --fail --silent --show-error http://127.0.0.1:18080/health); then
              [[ "$response" == '{"status":"ok"}' ]]
              [[ "$(docker exec "$container" id -u)" != '0' ]]
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Report immutable deployment candidate
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "### Development deployment candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed source: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable image: \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow did not deploy Cloud Run. Use the digest only in a reviewed Terraform plan." >> "$GITHUB_STEP_SUMMARY"
