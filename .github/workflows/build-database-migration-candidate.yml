name: Build database migration candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: build-database-migration-candidate
  cancel-in-progress: false

jobs:
  build-test-publish:
    name: Validate and publish dormant migration image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development

    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/engagement-migration

    steps:
      - name: Validate required environment variables
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Missing GCP_PROJECT_ID environment variable}"
          : "${GCP_REGION:?Missing GCP_REGION environment variable}"
          : "${GCP_ARTIFACT_REPOSITORY:?Missing GCP_ARTIFACT_REPOSITORY environment variable}"
          : "${GCP_WORKLOAD_IDENTITY_PROVIDER:?Missing GCP_WORKLOAD_IDENTITY_PROVIDER environment variable}"
          : "${GCP_SERVICE_ACCOUNT:?Missing GCP_SERVICE_ACCOUNT environment variable}"

      - name: Check out the selected reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            database/requirements.lock
            services/engagement-api/requirements-dev.lock

      - name: Run migration image release gate
        run: |
          python -m pip install -r database/requirements.lock -r services/engagement-api/requirements-dev.lock
          python -m ruff check --config services/engagement-api/pyproject.toml database/migration_runner.py tools/validate_database_migrations.py
          python -m py_compile database/migration_runner.py
          python tools/validate_database_migrations.py
          python -m bandit --quiet database/migration_runner.py
          python -m pip_audit --requirement database/requirements.lock --disable-pip --no-deps

      - name: Authenticate to Google Cloud without a stored key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true

      - name: Sign in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and publish candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: database
          file: database/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=engagement-migration
          cache-to: type=gha,mode=max,scope=engagement-migration

      - name: Verify fail-closed container contract
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$(docker run --rm --entrypoint id "$IMAGE@$DIGEST" -u)" != '0' ]]
          if docker run --rm "$IMAGE@$DIGEST"; then
            echo 'Migration image ran without an explicit mode.' >&2
            exit 1
          fi

      - name: Report immutable migration candidate
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "### Dormant database migration candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed source: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Immutable image: \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow built an image only. It did not create or execute a migration job and did not connect to Cloud SQL." >> "$GITHUB_STEP_SUMMARY"
