name: Verify development deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-development-deployment
  cancel-in-progress: false

jobs:
  verify-private-health:
    name: Verify private Cloud Run health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development

    env:
      SERVICE_ORIGIN: ${{ vars.GCP_CLOUD_RUN_ORIGIN }}

    steps:
      - name: Validate the configured Cloud Run origin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          origin = os.environ.get("SERVICE_ORIGIN", "")
          parsed = urlsplit(origin)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or not parsed.hostname.endswith(".run.app")
              or parsed.port is not None
              or parsed.username is not None
              or parsed.password is not None
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit(
                  "GCP_CLOUD_RUN_ORIGIN must be an HTTPS run.app origin without "
                  "credentials, port, path, query or fragment"
              )
          PY

      - name: Mint a short-lived token for the exact service origin
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ env.SERVICE_ORIGIN }}
          id_token_include_email: true
          create_credentials_file: false

      - name: Verify authenticated health response
        shell: bash
        env:
          ID_TOKEN: ${{ steps.auth.outputs.id_token }}
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/ee-health-headers"
          body="$RUNNER_TEMP/ee-health-body"
          cleanup() { rm -f "$headers" "$body"; }
          trap cleanup EXIT

          status=$(curl --silent --show-error --proto '=https' --tlsv1.2 \
            --max-redirs 0 \
            --header "Authorization: Bearer $ID_TOKEN" \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            "$SERVICE_ORIGIN/health")

          [[ "$status" == "200" ]]
          [[ "$(tr -d '\r\n' < "$body")" == '{"status":"ok"}' ]]
          grep --ignore-case --quiet '^cache-control:.*no-store' "$headers"
          grep --ignore-case --quiet '^x-content-type-options:.*nosniff' "$headers"
          echo "Authenticated Cloud Run health verification passed."
