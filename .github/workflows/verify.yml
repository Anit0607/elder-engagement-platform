name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check public repository boundary
        shell: pwsh
        run: ./tools/check_public_repository.ps1 -Tracked

  contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/contract-tests/package-lock.json
      - name: Validate configuration contract
        run: |
          node tools/validate_engagement_config.mjs
          node --test config/engagement/validation.test.mjs
      - name: Validate REST contract
        run: |
          node tools/validate_engagement_openapi.mjs
          node tools/generate_api_handover.mjs --check
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: database/tests/requirements.lock
      - name: Install locked database tooling
        run: python -m pip install -r database/tests/requirements.lock
      - name: Validate database scope
        run: |
          node tools/validate_engagement_schema.mjs
          python tools/validate_database_migrations.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python tools/validate_database_migrations.py --immutable-base "${{ github.event.pull_request.base.sha }}"
          fi
      - name: Test database role guards on PostgreSQL 16
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          python database/tests/test_bootstrap_sql.py
          python database/tests/test_migration_runner.py
          python database/tests/test_staff_role_concurrency.py
      - name: Validate infrastructure safety controls
        run: npm test --prefix infrastructure
      - name: Install REST contract checks
        working-directory: api/contract-tests
        run: npm ci
      - name: Run REST contract checks
        working-directory: api/contract-tests
        run: npm test

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            services/engagement-api/requirements.lock
            services/engagement-api/requirements-dev.lock
            database/requirements.lock
      - name: Install locked dependencies
        working-directory: services/engagement-api
        run: python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Lint
        working-directory: services/engagement-api
        run: >-
          python -m ruff check app tests tools
          ../../database/migration_runner.py
          ../../database/tests/test_bootstrap_sql.py
          ../../database/tests/test_migration_runner.py
          ../../tools/validate_database_migrations.py
      - name: Test with coverage gate
        working-directory: services/engagement-api
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=90
      - name: Security and locked-dependency audit
        working-directory: services/engagement-api
        run: |
          python -m bandit --quiet --recursive app
          python -m bandit --quiet ../../database/migration_runner.py
          python -m pip_audit --requirement requirements.lock --disable-pip --no-deps
          python -m pip_audit --requirement ../../database/tests/requirements.lock --disable-pip --no-deps
          python -m pip_audit --requirement ../../database/requirements.lock --disable-pip --no-deps
