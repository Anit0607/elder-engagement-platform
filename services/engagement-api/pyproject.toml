[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "elder-engagement-api"
version = "0.1.0"
description = "Process foundation for the Elder Engagement Platform REST API."
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg==0.31.0",
  "CacheControl==0.14.4",
  "cloud-sql-python-connector==1.22.0",
  "fastapi==0.141.1",
  "google-auth==2.58.0",
  "pydantic==2.13.4",
  "PyJWT==2.14.0",
  "requests==2.34.2",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==6.3.0",
  "ruff==0.16.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
